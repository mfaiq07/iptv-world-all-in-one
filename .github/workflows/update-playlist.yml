name: Update IPTV playlist

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild playlist
        shell: pwsh
        run: ./build-merged-iptv.ps1

      - name: Commit updated playlist
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add world-all-in-one.m3u
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Update IPTV playlist"
            git push
          }
